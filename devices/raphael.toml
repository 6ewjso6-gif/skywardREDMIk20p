[device]
codename = "raphael"
brand = "Redmi"
model = "Redmi K20 Pro"
# A-only: one boot and one recovery partition, and no dynamic partitions.
ab = false
soc = { hans = "骁龙®855移动平台", hant = "Snapdragon® 855 行動平台", en = "Snapdragon® 855 Mobile Platform" }
os_version_prop = "ro.build.version.incremental"

[display]
# 6.39 inches, 19.5:9, as the panel reports itself.
width = 1080
height = 2340
density = 440
diagonal = 6.39

# Android 10 and 11 keep their kernel modules in the vendor partition, in
# /vendor/lib/modules, the only place the stock recovery loads them from.
[modules]
sources = ["vendor"]

# The recovery runs from the ramdisk, so the system partition is free to
# be mounted where the phone's own table puts it: its build properties say
# which system is installed, and the file manager browses it.
[partitions]
mounted = ["system"]

# The baseband's settings and the sensors' calibration, as every Xiaomi
# phone of this generation keeps them.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]

# The MIUI build the recovery is made on. Its recovery partition is not in the
# recovery package, which carries no payload, but in images/recovery.img of the
# fastboot package; the hash is of that image.
[stock]
version = "V12.5.6.0.RFKCNXM"
package = "https://cdnorg.d.miui.com/V12.5.6.0.RFKCNXM/raphael_images_V12.5.6.0.RFKCNXM_20211025.0000.00_11.0_cn_b9074ff524.tgz"
recovery = "4f75a633c527229d5b71603429880a595bbdb1b90ebb2eb5f94f834dd0a2a90d"
partition_size = 67108864

[update]
server = "https://update.miui.com/updates/miotaV3.php"
